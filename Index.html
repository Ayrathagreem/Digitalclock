<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Shop</title>
    <link rel="stylesheet" href="Index.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Smooch+Sans:wght@100..900&display=swap" rel="stylesheet">

    <script src="index.js" defer></script>

</head>
<body>


 <div id="navigation" class="navigation_box">
        <nav class="nav_box">
            <span class="logo"></span>
            <ul>
                <li>Home</li>
                <li>Flowers</li>
                <li>Garland</li>
                <li>Wedding</li>
                <li>Pooja Items</li>
                <li>Custom Orders</li>
                <li>About Us</li>
                <li>Contact Us</li>
            </ul>
        </nav>
    </div>

    <div class="banner">
        <div class="slides">
            <img src="360-buds-banner-light.png" alt="beautiful flower">
            <img src="360-buds-banner-dark.png" alt="wedding flower">
            <img src="360-buds-banner-blank.png" alt="Custom">
        </div>
            <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
            <button class="next" onclick="changeSlide(1)">&#10095;</button>

    </div>

    <div class="dots">
        <span onclick="currentSlide(0)"></span>
        <span onclick="currentSlide(1)"></span>
    </div>
</body>
</html>
